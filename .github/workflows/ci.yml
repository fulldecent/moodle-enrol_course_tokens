# .github/workflows/ci.yml
name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    uses: catalyst/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    with:
      # Keep CI focused on build/runtime checks.
      moodle_branches: MOODLE_502_STABLE
      disable_behat: true
      disable_mustache: true
      disable_phpdoc: true
      disable_version_bump_check: true

      # Publishing is handled manually.
      disable_release: true
      